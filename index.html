<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนนักศึกษา</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-text: #dc2626;
      --danger-border: #fecaca;
      --success-bg: #ecfdf5;
      --success-text: #059669;
      --success-border: #a7f3d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 32px 16px;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      padding: 28px;
      margin-bottom: 24px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #334155;
    }

    label span.req {
      color: #ef4444;
    }

    input, select {
      font-family: 'Prompt', sans-serif;
      font-size: 15px;
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #f8fafc;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 280px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      font-size: 14px;
      border-radius: 20px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
      pointer-events: none;
    }

    .btn-submit {
      font-family: 'Prompt', sans-serif;
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .btn-delete {
      font-family: 'Prompt', sans-serif;
      background-color: #fee2e2;
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .alert {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      align-items: center;
      gap: 8px;
    }

    .alert.show {
      display: flex;
    }

    .alert.error {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }

    .alert.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .badge {
      background-color: #e0f2fe;
      color: #0284c7;
      font-size: 13px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14.5px;
    }

    thead {
      background-color: #f8fafc;
      border-bottom: 1.5px solid var(--border-color);
    }

    th {
      padding: 13px 16px;
      font-weight: 500;
      color: #475569;
      white-space: nowrap;
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-color);
      color: #334155;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full-width {
        grid-column: span 1;
      }
      .search-box {
        max-width: 100%;
      }
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎓 ระบบลงทะเบียนนักศึกษา</h1>
      <p>บันทึก ค้นหา และจัดการข้อมูลนักศึกษาแบบเรียลไทม์</p>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📝 แบบฟอร์มลงทะเบียน</div>
      </div>

      <form id="regForm" onsubmit="event.preventDefault(); register();">
        <div class="form-grid">
          <div class="form-group">
            <label for="first_name">ชื่อ <span class="req">*</span></label>
            <input id="first_name" type="text" placeholder="เช่น สมชาย">
          </div>

          <div class="form-group">
            <label for="last_name">นามสกุล <span class="req">*</span></label>
            <input id="last_name" type="text" placeholder="เช่น ใจดี">
          </div>

          <div class="form-group">
            <label for="nickname">ชื่อเล่น</label>
            <input id="nickname" type="text" placeholder="เช่น ชาย (ไม่บังคับ)">
          </div>

          <div class="form-group">
            <label for="student_id">รหัสนักศึกษา <span class="req">*</span></label>
            <input id="student_id" type="text" placeholder="เช่น 66010001">
          </div>

          <div class="form-group full-width">
            <label for="major">สาขาวิชา <span class="req">*</span></label>
            <select id="major" onchange="toggleOtherMajor()">
              <option value="">-- เลือกสาขาวิชา --</option>
              <option value="วิทยาการคอมพิวเตอร์">วิทยาการคอมพิวเตอร์</option>
              <option value="เทคโนโลยีสารสนเทศ">เทคโนโลยีสารสนเทศ</option>
              <option value="วิศวกรรมซอฟต์แวร์">วิศวกรรมซอฟต์แวร์</option>
              <option value="วิศวกรรมคอมพิวเตอร์">วิศวกรรมคอมพิวเตอร์</option>
              <option value="วิทยาการข้อมูล (Data Science)">วิทยาการข้อมูล (Data Science)</option>
              <option value="เทคโนโลยีมัลติมีเดียและแอนิเมชัน">เทคโนโลยีมัลติมีเดียและแอนิเมชัน</option>
              <option value="other">อื่นๆ (ระบุเอง)...</option>
            </select>
            <input id="custom_major" type="text" placeholder="ระบุชื่อสาขาวิชาของคุณ" style="display: none; margin-top: 10px;">
          </div>
        </div>

        <button id="submitBtn" type="submit" class="btn-submit">บันทึกข้อมูลลงทะเบียน</button>
      </form>

      <div id="msgBox" class="alert"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>📋 รายชื่อนักศึกษา</span>
          <span id="totalCount" class="badge">0 คน</span>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="text" placeholder="ค้นหาชื่อ, รหัส, สาขา..." oninput="filterRows()">
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">#</th>
              <th>ชื่อ - นามสกุล</th>
              <th>ชื่อเล่น</th>
              <th>รหัสนักศึกษา</th>
              <th>สาขาวิชา</th>
              <th style="width: 80px; text-align: center;">จัดการ</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr>
              <td colspan="6" class="empty-state">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script>
    // แก้ไข URL ให้ถูกต้อง (ไม่มี /rest/v1/)
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1aRb9ouElfFhJp5Z6_ab7g_MRIgAzaR';
